<div id="sp-unified-preview" aria-label="Sound Party 主组件与设置统一设计预览">
  <style>
    #sp-unified-preview { width:100%; color-scheme:light dark; container-type:inline-size; container-name:sp-preview; --sp-caption:light-dark(#66615a,#b9b2a9); }
    #sp-unified-preview * { box-sizing:border-box; }
    #sp-unified-preview [hidden] { display:none !important; }
    #sp-unified-preview .sp-preview-label { margin:0 0 12px; padding-right:94px; font:400 12px/1.5 "Segoe UI",sans-serif; color:var(--sp-caption); }
    #sp-unified-preview .sp-stage { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr)); gap:24px; align-items:start; justify-content:center; min-height:492px; padding:20px 12px 24px; }
    #sp-unified-preview .sp-column { min-width:0; max-width:var(--sp-width,388px); width:100%; justify-self:center; }
    #sp-unified-preview .sp-caption { margin:0 0 12px; color:var(--sp-caption); font:400 12px/1.5 "Segoe UI",sans-serif; display:flex; justify-content:space-between; gap:8px; }
    #sp-unified-preview .sp-product {
      --sp-carbon:#171716; --sp-raised:#242220; --sp-ink:#f3efe9;
      --sp-muted:#aaa49b; --sp-faint:#928a80; --sp-line:#34312d;
      --sp-orange:#b06b50; --sp-orange-ink:#231713; --sp-green:#8aa68c;
      --sp-radius:22px;
      background:var(--sp-carbon); color:var(--sp-ink); color-scheme:dark;
      border:1px solid var(--sp-line); border-radius:var(--sp-radius);
      font:400 13px/1.45 "Segoe UI Variable","Segoe UI","Microsoft YaHei UI",sans-serif;
      overflow:hidden; width:100%; text-align:left;
    }
    #sp-unified-preview .sp-product button,
    #sp-unified-preview .sp-product input { font:inherit; }
    #sp-unified-preview .sp-product button { min-height:34px; padding:7px 11px; color:var(--sp-ink); border:1px solid var(--sp-line); border-radius:10px; background:var(--sp-raised); display:inline-flex; align-items:center; justify-content:center; gap:7px; }
    #sp-unified-preview .sp-product button:hover { background:#302b27; }
    #sp-unified-preview .sp-product button:disabled { background:transparent; color:var(--sp-muted); border-color:transparent; }
    #sp-unified-preview .sp-product button[aria-pressed="true"] { color:var(--sp-ink); background:#483127; border-color:var(--sp-orange); }
    #sp-unified-preview .sp-product svg { width:16px; height:16px; flex:none; }
    #sp-unified-preview .sp-widget { display:grid; grid-template-columns:minmax(0,1fr) 42px; min-height:230px; position:relative; }
    #sp-unified-preview .sp-widget-content { min-width:0; padding:20px 18px 18px; display:flex; flex-direction:column; gap:0; background-image:repeating-linear-gradient(0deg,transparent 0 6px,#f3efe903 6px 7px),repeating-linear-gradient(90deg,transparent 0 6px,#f3efe902 6px 7px); }
    #sp-unified-preview .sp-device { display:grid; grid-template-columns:19px minmax(0,1fr) auto; gap:11px; align-items:center; }
    #sp-unified-preview .sp-speaker-object { width:19px; height:36px; border-radius:6px; background:linear-gradient(90deg,#55574f,#66645b); position:relative; }
    #sp-unified-preview .sp-speaker-object::after { content:""; position:absolute; top:6px; bottom:6px; right:3px; width:2px; border-radius:2px; background:var(--sp-orange); }
    #sp-unified-preview .sp-device-name { margin:0; font-size:14px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #sp-unified-preview .sp-subtitle { margin:3px 0 0; color:var(--sp-muted); font-size:11px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
    #sp-unified-preview .sp-connected-dot { width:5px; height:5px; border-radius:50%; background:var(--sp-green); flex:none; }
    #sp-unified-preview .sp-battery { display:flex; flex-direction:column; align-items:flex-end; gap:1px; min-width:45px; font-variant-numeric:tabular-nums; }
    #sp-unified-preview .sp-battery-label { font-size:11px; color:var(--sp-muted); }
    #sp-unified-preview .sp-battery-value { font-size:15px; font-weight:500; display:flex; align-items:center; gap:4px; }
    #sp-unified-preview .sp-battery[data-low="true"] .sp-battery-value { color:#c79a72; }
    #sp-unified-preview .sp-volume { margin-top:24px; }
    #sp-unified-preview .sp-field-title { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    #sp-unified-preview .sp-value { color:var(--sp-muted); font-variant-numeric:tabular-nums; white-space:nowrap; }
    #sp-unified-preview .sp-range { display:block; width:100%; margin:4px 0 0; height:32px; padding:0; background:transparent; accent-color:var(--sp-orange); appearance:none; -webkit-appearance:none; }
    #sp-unified-preview .sp-range::-webkit-slider-runnable-track { height:3px; border-radius:3px; background:linear-gradient(to right,var(--sp-orange) 0 var(--sp-progress,26%),#44403a var(--sp-progress,26%) 100%); }
    #sp-unified-preview .sp-range::-webkit-slider-thumb { appearance:none; -webkit-appearance:none; height:12px; width:12px; margin-top:-4.5px; border-radius:50%; border:0; background:var(--sp-ink); }
    #sp-unified-preview .sp-range::-moz-range-track { height:3px; background:#44403a; border-radius:3px; }
    #sp-unified-preview .sp-range::-moz-range-progress { height:3px; background:var(--sp-orange); }
    #sp-unified-preview .sp-range::-moz-range-thumb { width:12px; height:12px; border:0; border-radius:50%; background:var(--sp-ink); }
    #sp-unified-preview .sp-widget-footer { margin-top:auto; padding-top:14px; display:flex; align-items:center; justify-content:space-between; gap:8px; }

    #sp-unified-preview .sp-rail { background:var(--sp-orange); color:var(--sp-orange-ink); display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:10px 3px; }
    #sp-unified-preview .sp-rail button { border:0; color:var(--sp-orange-ink); background:transparent; padding:8px 2px; width:34px; min-height:36px; font-size:11px; }
    #sp-unified-preview .sp-rail button:hover { background:#23171319; }
    #sp-unified-preview .sp-rail-brand { writing-mode:vertical-rl; letter-spacing:2px; font-size:11px; opacity:.7; }
    #sp-unified-preview .sp-top-actions { display:none; gap:5px; align-items:center; margin:14px 0 0; }
    #sp-unified-preview .sp-top-actions button { font-size:12px; }
    #sp-unified-preview .sp-toolbar-layout .sp-widget { grid-template-columns:1fr; }
    #sp-unified-preview .sp-toolbar-layout .sp-widget-content { border-top:3px solid var(--sp-orange); }
    #sp-unified-preview .sp-toolbar-layout .sp-rail { display:none; }
    #sp-unified-preview .sp-toolbar-layout .sp-top-actions { display:flex; }
    #sp-unified-preview .sp-toolbar-layout .sp-volume { margin-top:15px; }
    #sp-unified-preview .sp-toolbar-layout .sp-inline-mute { display:none; }
    #sp-unified-preview .sp-collapsed .sp-volume,
    #sp-unified-preview .sp-collapsed .sp-widget-footer,
    #sp-unified-preview .sp-collapsed .sp-media { display:none !important; }
    #sp-unified-preview .sp-collapsed .sp-top-actions button:not([data-action="collapse"]) { display:none; }
    #sp-unified-preview .sp-widget.sp-collapsed { min-height:96px; }
    #sp-unified-preview .sp-widget.sp-collapsed .sp-rail-brand { display:none; }
    #sp-unified-preview .sp-media { margin-top:18px; padding:11px 0; border-top:1px solid var(--sp-line); border-bottom:1px solid var(--sp-line); }
    #sp-unified-preview .sp-media-label { color:var(--sp-muted); font-size:11px; }
    #sp-unified-preview .sp-media-title { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:5px; }
    #sp-unified-preview .sp-media-title strong { font-weight:500; font-size:13px; }
    #sp-unified-preview .sp-settings { min-height:440px; padding:18px 20px 16px; }
    #sp-unified-preview .sp-settings-header { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:15px; }
    #sp-unified-preview .sp-settings-header h2 { font-size:17px; font-weight:500; margin:0; }
    #sp-unified-preview .sp-close { width:34px; padding:4px !important; font-size:19px !important; background:transparent !important; }
    #sp-unified-preview .sp-section-label { margin:0 0 4px; color:var(--sp-muted); font-weight:400; font-size:11px; }
    #sp-unified-preview .sp-setting-row { min-height:34px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
    #sp-unified-preview .sp-setting-row span { min-width:0; }
    #sp-unified-preview .sp-toggle { flex:none; appearance:none; -webkit-appearance:none; margin:0; width:30px; height:18px; border:0; border-radius:12px; background:#4b463f; position:relative; }
    #sp-unified-preview .sp-toggle::before { content:""; position:absolute; width:12px; height:12px; top:3px; left:3px; background:var(--sp-ink); border-radius:50%; transition:transform .12s ease-out; }
    #sp-unified-preview .sp-toggle:checked { background:var(--sp-orange); }
    #sp-unified-preview .sp-toggle:checked::before { transform:translateX(12px); }
    #sp-unified-preview .sp-divider { height:1px; margin:12px 0; background:var(--sp-line); }
    #sp-unified-preview .sp-position-row { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:4px; }
    #sp-unified-preview .sp-position-row span { color:var(--sp-muted); font-size:11px; }
    #sp-unified-preview .sp-position-row button { font-size:12px; min-height:30px; padding:4px 8px; }
    #sp-unified-preview .sp-reminder-detail { margin:1px 0 0; color:var(--sp-muted); font-size:11px; line-height:1.5; }
    #sp-unified-preview .sp-capabilities { margin-top:12px; color:var(--sp-muted); font-size:11px; }
    #sp-unified-preview .sp-capabilities summary { min-height:30px; display:list-item; list-style-position:inside; }
    #sp-unified-preview .sp-capabilities p { margin:5px 0 0; line-height:1.7; }
    #sp-unified-preview .sp-settings-foot { margin:12px 0 0; padding-top:10px; border-top:1px solid var(--sp-line); color:var(--sp-faint); font-size:11px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
    #sp-unified-preview .sp-empty { min-height:440px; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:15px; padding:20px; }
    @container sp-preview (max-width:600px) {
      #sp-unified-preview .sp-stage { grid-template-columns:minmax(0,1fr); min-height:784px; padding:16px 6px 24px; gap:22px; }
      #sp-unified-preview .sp-column { max-width:min(100%,var(--sp-width,388px)); }
      #sp-unified-preview .sp-preview-label { padding-right:0; }
      #sp-unified-preview .sp-settings { padding:18px 17px 16px; }
      #sp-unified-preview .sp-widget-content { padding:18px 15px; }
      #sp-unified-preview .sp-device { gap:8px; }
      #sp-unified-preview .sp-device-name { font-size:13px; }
    }
    @media (pointer:coarse) {
      #sp-unified-preview .sp-product button { min-height:44px; }
      #sp-unified-preview .sp-setting-row { min-height:44px; }
      #sp-unified-preview .sp-range { height:44px; }
    }
    @media (prefers-reduced-motion:reduce) { #sp-unified-preview .sp-toggle::before { transition:none; } }
  </style>

  <p class="sp-preview-label">比例与交互预览 · 示例数据，不连接设备</p>
  <div class="viz-carousel viz-dotted-background" aria-label="主组件与设置的统一设计方向" data-previous-label="上一方案" data-next-label="下一方案">
    <section data-variant="音箱侧栏" aria-label="音箱侧栏方案"></section>
    <section data-variant="轻量顶栏" class="sp-toolbar-layout" aria-label="轻量顶栏方案" hidden></section>
  </div>

  <template id="sp-unified-panel-template">
    <div class="sp-stage">
      <div class="sp-column">
        <div class="sp-caption"><span>主组件</span><span data-size-label>宽度基线 388 DIP</span></div>
        <section class="sp-product sp-widget" aria-label="模拟音箱主组件">
          <div class="sp-widget-content">
            <header class="sp-device">
              <div class="sp-speaker-object" aria-hidden="true"></div>
              <div>
                <h2 class="sp-device-name" data-tooltip="Xiaomi蓝牙音箱Pro">Xiaomi蓝牙音箱Pro</h2>
                <p class="sp-subtitle"><span class="sp-connected-dot"></span><span data-output-detail>已连接 · 当前输出</span></p>
              </div>
              <div class="sp-battery" data-low="false">
                <span class="sp-battery-label">电量</span>
                <span class="sp-battery-value"><i data-lucide="battery-low" data-low-icon aria-hidden="true" hidden></i><span data-battery-value>100%</span></span>
              </div>
            </header>
            <div class="sp-top-actions">
              <button type="button" class="cursor-interaction" data-action="mute" aria-pressed="false"><span data-mute-text>静音</span></button>
              <button type="button" class="cursor-interaction" data-action="settings">设置</button>
              <button type="button" class="cursor-interaction" data-action="collapse">收起</button>
            </div>
            <div class="sp-media" hidden>
              <span class="sp-media-label">媒体示例</span>
              <div class="sp-media-title"><strong>午後的房间</strong><button type="button" class="cursor-interaction" data-action="play" aria-pressed="false">播放</button></div>
            </div>
            <div class="sp-volume">
              <label class="sp-field-title"><span>音量</span><span class="sp-value" data-volume-value>26%</span></label>
              <input type="range" class="sp-range cursor-interaction" data-volume min="0" max="100" value="26" aria-label="模拟音量" />
            </div>
            <footer class="sp-widget-footer">
              <button type="button" class="sp-output cursor-interaction" data-action="output" disabled>✓ 当前音频输出</button>
              <button type="button" class="sp-inline-mute cursor-interaction" data-action="mute" aria-pressed="false"><span data-mute-text>静音</span></button>
            </footer>
          </div>
          <aside class="sp-rail" aria-label="快捷操作">
            <button type="button" class="cursor-interaction" data-action="collapse" aria-label="收起模拟组件"><span data-collapse-text>‹</span></button>
            <span class="sp-rail-brand" aria-hidden="true">SOUND PARTY</span>
            <button type="button" class="cursor-interaction" data-action="settings">设置</button>
          </aside>
        </section>
      </div>
      <div class="sp-column">
        <div class="sp-caption"><span>设置面板</span><span>约 440–480 DIP</span></div>
        <section class="sp-product sp-settings" aria-label="模拟本地设置">
          <header class="sp-settings-header"><h2>设置</h2><button type="button" class="sp-close cursor-interaction" data-action="close-settings" aria-label="关闭模拟设置">×</button></header>
          <p class="sp-section-label">常规</p>
          <label class="sp-setting-row cursor-interaction"><span>登录 Windows 后启动</span><input type="checkbox" class="sp-toggle" data-setting="startup" checked role="switch" aria-label="模拟开机启动" /></label>
          <label class="sp-setting-row cursor-interaction"><span>离线时自动收为图标</span><input type="checkbox" class="sp-toggle" data-setting="offline" checked role="switch" aria-label="模拟离线自动收起" /></label>
          <label class="sp-setting-row cursor-interaction"><span>组件始终置顶</span><input type="checkbox" class="sp-toggle" data-setting="topmost" role="switch" aria-label="模拟始终置顶" /></label>
          <div class="sp-divider"></div>
          <label class="sp-field-title"><span>组件不透明度</span><span class="sp-value" data-opacity-value>100%</span></label>
          <input type="range" class="sp-range cursor-interaction" data-opacity min="65" max="100" step="5" value="100" aria-label="模拟组件不透明度" />
          <div class="sp-position-row"><span data-position>位置已记忆</span><button type="button" class="cursor-interaction" data-action="position">重置位置</button></div>
          <div class="sp-divider"></div>
          <label class="sp-setting-row cursor-interaction"><span>低电量提醒</span><input type="checkbox" class="sp-toggle" data-setting="notifications" checked role="switch" aria-label="模拟低电量提醒" /></label>
          <p class="sp-reminder-detail">20% / 10% · 同一放电区间不重复提醒</p>
          <details class="sp-capabilities"><summary class="cursor-interaction">设备能力</summary><p>电量：Windows HFP · 已验证<br />充电识别：暂缓，不继续探索<br />Bass / 灯效：未验证</p></details>
          <footer class="sp-settings-foot"><span>本地设置 · 自动保存</span><span data-save-state aria-live="polite">仅预览</span></footer>
        </section>
        <section class="sp-product sp-empty" data-settings-empty aria-label="模拟设置已关闭" hidden><span>设置已关闭</span><button type="button" class="cursor-interaction" data-action="settings">重新打开设置</button></section>
      </div>
    </div>
  </template>

  <script>
    (() => {
      const root = document.getElementById('sp-unified-preview');
      const template = document.getElementById('sp-unified-panel-template');
      if (!root || !template) return;
      const defaults = { width:388, radius:22, accent:'#b06b50', battery:100, currentOutput:true, media:false };
      const uiDefaults = { volume:26, muted:false, opacity:100, startup:true, offline:true, topmost:false, notifications:true, collapsed:false, settingsOpen:true, playing:false, positionReset:false, capabilitiesOpen:false };
      const initial = window.openai?.widgetState;
      const design = { ...defaults };
      const models = [];
      function clamp(value, min, max, fallback) { return Number.isFinite(Number(value)) ? Math.max(min,Math.min(max,Number(value))) : fallback; }
      function restoreDesign(saved) {
        if (!saved || typeof saved !== 'object') return;
        design.width = clamp(saved.width,348,408,388);
        design.radius = clamp(saved.radius,16,26,22);
        design.battery = clamp(saved.battery,0,100,100);
        design.accent = /^#[0-9a-f]{6}$/i.test(saved.accent || '') ? saved.accent : defaults.accent;
        design.currentOutput = typeof saved.currentOutput === 'boolean' ? saved.currentOutput : true;
        design.media = typeof saved.media === 'boolean' ? saved.media : false;
      }
      function restoreUi(saved) {
        const next = { ...uiDefaults };
        if (!saved || typeof saved !== 'object') return next;
        next.volume = clamp(saved.volume,0,100,26);
        next.opacity = clamp(saved.opacity,65,100,100);
        for (const key of Object.keys(uiDefaults)) {
          if (typeof uiDefaults[key] === 'boolean' && typeof saved[key] === 'boolean') next[key] = saved[key];
        }
        return next;
      }
      restoreDesign(initial?.modelContent?.design);
      const save = () => {
        if (typeof window.openai?.setWidgetState !== 'function') return;
        const variants = Object.fromEntries(models.map(model => [model.name,{ ...model.state }]));
        Promise.resolve(window.openai.setWidgetState({ modelContent:{ design:{ ...design } }, privateContent:{ variants } })).catch(() => {});
      };
      function render(model) {
        const { element, state } = model;
        const widget = element.querySelector('.sp-widget');
        root.style.setProperty('--sp-width',design.width + 'px');
        element.querySelector('[data-size-label]').textContent = '宽度基线 ' + Math.round(design.width) + ' DIP';
        element.querySelectorAll('.sp-product').forEach(surface => {
          surface.style.setProperty('--sp-orange',design.accent);
          surface.style.setProperty('--sp-radius',design.radius + 'px');
        });
        widget.style.opacity = state.opacity / 100;
        widget.classList.toggle('sp-collapsed',state.collapsed);
        element.querySelector('.sp-battery').dataset.low = String(design.battery <= 20);
        element.querySelector('[data-low-icon]').hidden = design.battery > 20;
        element.querySelector('[data-battery-value]').textContent = Math.round(design.battery) + '%';
        element.querySelector('[data-output-detail]').textContent = design.currentOutput ? '已连接 · 当前输出' : '已连接 · 非当前输出';
        const output = element.querySelector('[data-action="output"]');
        output.textContent = design.currentOutput ? '✓ 当前音频输出' : '设为当前音频输出';
        output.disabled = design.currentOutput;
        const volume = element.querySelector('[data-volume]');
        volume.value = String(state.volume);
        volume.style.setProperty('--sp-progress',state.volume + '%');
        element.querySelector('[data-volume-value]').textContent = state.muted ? '已静音 · ' + Math.round(state.volume) + '%' : Math.round(state.volume) + '%';
        element.querySelectorAll('[data-action="mute"]').forEach(button => { button.setAttribute('aria-pressed',String(state.muted)); button.querySelector('[data-mute-text]').textContent = state.muted ? '取消静音' : '静音'; });
        element.querySelectorAll('[data-action="collapse"]').forEach(button => {
          button.setAttribute('aria-label',state.collapsed ? '展开模拟组件' : '收起模拟组件');
          const arrow = button.querySelector('[data-collapse-text]');
          if (arrow) arrow.textContent = state.collapsed ? '›' : '‹'; else button.textContent = state.collapsed ? '展开' : '收起';
        });
        element.querySelector('.sp-media').hidden = !design.media || state.collapsed;
        const play = element.querySelector('[data-action="play"]');
        play.textContent = state.playing ? '暂停' : '播放';
        play.setAttribute('aria-pressed',String(state.playing));
        element.querySelector('.sp-settings').hidden = !state.settingsOpen;
        element.querySelector('[data-settings-empty]').hidden = state.settingsOpen;
        const opacity = element.querySelector('[data-opacity]');
        opacity.value = String(state.opacity);
        opacity.style.setProperty('--sp-progress',((state.opacity - 65) / 35 * 100) + '%');
        element.querySelector('[data-opacity-value]').textContent = Math.round(state.opacity) + '%';
        element.querySelectorAll('[data-setting]').forEach(input => { input.checked = state[input.dataset.setting]; });
        element.querySelector('[data-position]').textContent = state.positionReset ? '预览：位置已重置' : '位置已记忆';
        element.querySelector('.sp-capabilities').open = state.capabilitiesOpen;
      }
      function renderAll() { models.forEach(render); }
      root.querySelectorAll('[data-variant]').forEach(element => {
        element.appendChild(template.content.cloneNode(true));
        const name = element.dataset.variant;
        const model = { element,name,state:restoreUi(initial?.privateContent?.variants?.[name]) };
        models.push(model);
        function changed() {
          render(model);
          element.querySelector('[data-save-state]').textContent = '预览已更新';
          save();
        }
        element.querySelector('[data-volume]').addEventListener('input',event => { model.state.volume = clamp(event.target.value,0,100,26); changed(); });
        element.querySelector('[data-opacity]').addEventListener('input',event => { model.state.opacity = clamp(event.target.value,65,100,100); changed(); });
        element.querySelectorAll('[data-setting]').forEach(input => input.addEventListener('change',() => { model.state[input.dataset.setting] = input.checked; changed(); }));
        element.querySelector('.sp-capabilities').addEventListener('toggle',event => {
          const open = event.target.open;
          if (model.state.capabilitiesOpen !== open) { model.state.capabilitiesOpen = open; save(); }
        });
        element.querySelectorAll('[data-action]').forEach(button => button.addEventListener('click',() => {
          switch (button.dataset.action) {
            case 'mute': model.state.muted = !model.state.muted; break;
            case 'settings': model.state.settingsOpen = true; break;
            case 'close-settings': model.state.settingsOpen = false; break;
            case 'collapse': model.state.collapsed = !model.state.collapsed; break;
            case 'position': model.state.positionReset = true; break;
            case 'play': model.state.playing = !model.state.playing; break;
            case 'output': design.currentOutput = true; renderAll(); break;
          }
          changed();
        }));
      });
      renderAll();
      if (globalThis.lucide) lucide.createIcons({ attrs:{ width:16,height:16 } });
      window.addEventListener('openai:set_globals',event => {
        const saved = event.detail?.globals?.widgetState;
        if (!saved) return;
        restoreDesign(saved.modelContent?.design);
        models.forEach(model => { model.state = restoreUi(saved.privateContent?.variants?.[model.name]); });
        renderAll();
      });
      if (globalThis.Tweak) {
        const tweak = new Tweak({ container:root,onChange:() => { renderAll(); save(); } });
        tweak.addSlider(design,'width',{ label:'两面板宽度基线',min:348,max:408,step:4,unit:'DIP',reference:'sp.width' });
        tweak.addSlider(design,'radius',{ label:'统一圆角',min:16,max:26,step:1,unit:'DIP',reference:'sp.radius' });
        tweak.addColorPicker(design,'accent',{ label:'统一强调色',reference:'sp.orange' });
        tweak.addSlider(design,'battery',{ label:'电量示例',min:0,max:100,step:10,unit:'%',reference:'sp.battery' });
        tweak.addToggle(design,'currentOutput',{ label:'模拟当前输出',reference:'sp.output' });
        tweak.addToggle(design,'media',{ label:'显示媒体示例',reference:'sp.media' });
      }
    })();
  </script>
</div>
