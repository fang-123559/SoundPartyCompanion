  <script>
    (() => {
      const root = document.getElementById("sound-party-widget-stateful-color");
      const widget = root.querySelector(".sc-widget");
      const label = root.querySelector("#sc-state-label");
      const tabs = [...root.querySelectorAll("[data-sc-state]")];
      const accents = {
        matched: { compact: "#9c6044", expanded: "#f45b16", ink: "#211008" },
        vivid: { compact: "#ae6038", expanded: "#f56600", ink: "#1f1007" },
        copper: { compact: "#815f4e", expanded: "#cb7145", ink: "#21150f" }
      };
      const state = {
        view: "compact",
        accentStyle: "matched",
        radius: 24,
        texture: true,
        expandedRail: true
      };
      const labels = {
        compact: "紧凑状态 · 克制",
        expanded: "展开状态 · 品牌色增强",
        offline: "离线状态 · 最低视觉干扰"
      };

      function render() {
        const accent = accents[state.accentStyle];
        const activeOrange = state.view === "expanded" ? accent.expanded : accent.compact;
        root.style.setProperty("--sc-orange", activeOrange);
        root.style.setProperty("--sc-orange-ink", accent.ink);
        root.style.setProperty("--sc-radius", `${state.radius}px`);
        widget.dataset.state = state.view;
        widget.classList.toggle("sc-no-texture", !state.texture);
        widget.classList.toggle("sc-no-rail", !state.expandedRail);
        label.textContent = labels[state.view];

        tabs.forEach((tab) => {
          const selected = tab.dataset.scState === state.view;
          tab.classList.toggle("active", selected);
          tab.setAttribute("aria-selected", String(selected));
        });
      }

      tabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          state.view = tab.dataset.scState;
          render();
        });
      });

      render();

      if (globalThis.Tweak) {
        const tweak = new Tweak({ container: root, onChange: render });
        tweak.addSelect(state, "view", {
          label: "预览状态",
          reference: "widget.view",
          options: [
            { label: "紧凑", value: "compact" },
            { label: "展开", value: "expanded" },
            { label: "离线", value: "offline" }
          ]
        });
        tweak.addSelect(state, "accentStyle", {
          label: "橙色风格",
