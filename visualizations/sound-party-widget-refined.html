<div id="sound-party-widget-refined">
  <style>
    #sound-party-widget-refined {
      --sp2-accent: #c96a36;
      --sp2-panel: #1b1a18;
      --sp2-panel-raised: #25231f;
      --sp2-panel-soft: #211f1c;
      --sp2-text: #f3eee7;
      --sp2-muted: #aaa39a;
      --sp2-faint: #77716a;
      --sp2-divider: rgba(243, 238, 231, 0.09);
      --sp2-track: rgba(243, 238, 231, 0.12);
      --sp2-shadow: rgba(24, 20, 16, 0.28);
      --sp2-desktop-a: #dcd6ce;
      --sp2-desktop-b: #c8c0b6;
      --sp2-radius: 24px;
      width: 100%;
      color: var(--sp2-text);
      font-family: "Segoe UI Variable", "Segoe UI", "Microsoft YaHei UI", sans-serif;
    }

    #sound-party-widget-refined .sp2-layout {
      display: grid;
      gap: 14px;
      width: 100%;
    }

    #sound-party-widget-refined .sp2-state-tabs {
      justify-self: center;
    }

    #sound-party-widget-refined .sp2-desktop {
      position: relative;
      min-height: 560px;
      overflow: hidden;
      border-radius: 20px;
      background:
        radial-gradient(circle at 76% 18%, rgba(255, 255, 255, 0.48), transparent 27%),
        linear-gradient(142deg, var(--sp2-desktop-a), var(--sp2-desktop-b));
      box-shadow: inset 0 0 0 1px rgba(41, 35, 29, 0.08);
      transition: background 180ms ease;
    }

    #sound-party-widget-refined .sp2-context {
      position: absolute;
      left: 30px;
      top: 32px;
      max-width: 300px;
      color: rgba(37, 32, 27, 0.64);
    }

    #sound-party-widget-refined .sp2-context strong {
      display: block;
      margin-bottom: 7px;
      color: rgba(29, 25, 21, 0.88);
      font-weight: 500;
    }

    #sound-party-widget-refined .sp2-desktop-mark {
      position: absolute;
      left: 30px;
      bottom: 27px;
      color: rgba(37, 32, 27, 0.48);
      letter-spacing: 0.02em;
    }

    #sound-party-widget-refined .sp2-widget {
      position: absolute;
      top: 34px;
      right: 34px;
      width: min(356px, calc(100% - 28px));
      min-height: 126px;
      overflow: hidden;
      border: 1px solid var(--sp2-divider);
      border-radius: var(--sp2-radius);
      background: var(--sp2-panel);
      box-shadow: 0 22px 56px var(--sp2-shadow), 0 4px 14px rgba(24, 20, 16, 0.13);
      transition: width 180ms ease, min-height 180ms ease, border-radius 180ms ease, background 180ms ease;
    }

    #sound-party-widget-refined .sp2-widget::before {
      content: "";
      position: absolute;
      z-index: 0;
      inset: 0;
      pointer-events: none;
      opacity: 0.42;
      background-image:
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.018) 0 1px, transparent 1px 4px),
        repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.035) 0 1px, transparent 1px 4px);
    }

    #sound-party-widget-refined .sp2-widget.sp2-clean::before {
      opacity: 0;
    }

    #sound-party-widget-refined .sp2-accent-spine {
      position: absolute;
      z-index: 3;
      top: 21px;
      right: 0;
      width: 3px;
      height: 46px;
      border-radius: 3px 0 0 3px;
      background: var(--sp2-accent);
      box-shadow: 0 0 18px color-mix(in srgb, var(--sp2-accent) 28%, transparent);
    }

    #sound-party-widget-refined .sp2-content {
      position: relative;
      z-index: 1;
      padding: 19px 21px 18px;
    }

    #sound-party-widget-refined .sp2-header {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
    }

    #sound-party-widget-refined .sp2-device-symbol {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      background: var(--sp2-panel-raised);
      color: var(--sp2-text);
    }

    #sound-party-widget-refined .sp2-device-copy {
      min-width: 0;
    }

    #sound-party-widget-refined .sp2-device-name {
      overflow: hidden;
      color: var(--sp2-text);
      font-weight: 500;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #sound-party-widget-refined .sp2-device-mode {
      margin-top: 3px;
      color: var(--sp2-muted);
    }

    #sound-party-widget-refined .sp2-connection {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--sp2-muted);
      white-space: nowrap;
    }

    #sound-party-widget-refined .sp2-connection-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #82a486;
      box-shadow: 0 0 0 3px rgba(130, 164, 134, 0.11);
    }

    #sound-party-widget-refined .sp2-summary {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: end;
      gap: 18px;
      margin-top: 18px;
    }

    #sound-party-widget-refined .sp2-battery-number {
      color: var(--sp2-text);
      font-size: 28px;
      font-weight: 400;
      letter-spacing: -0.045em;
    }

    #sound-party-widget-refined .sp2-battery-meta {
      display: grid;
      gap: 8px;
      min-width: 0;
    }

    #sound-party-widget-refined .sp2-meta-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--sp2-muted);
    }

    #sound-party-widget-refined .sp2-charge-label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--sp2-accent);
    }

    #sound-party-widget-refined .sp2-battery-track,
    #sound-party-widget-refined .sp2-volume-track {
      position: relative;
      height: 3px;
      overflow: visible;
      border-radius: 999px;
      background: var(--sp2-track);
    }

    #sound-party-widget-refined .sp2-battery-fill {
      position: relative;
      width: 68%;
      height: 100%;
      border-radius: inherit;
      background: var(--sp2-text);
    }

    #sound-party-widget-refined .sp2-battery-fill::after {
      content: "";
      position: absolute;
      top: 50%;
      right: -3px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--sp2-accent);
      transform: translateY(-50%);
    }

    #sound-party-widget-refined .sp2-expanded {
      display: none;
    }

    #sound-party-widget-refined .sp2-widget[data-state="expanded"] {
      min-height: 392px;
    }

    #sound-party-widget-refined .sp2-widget[data-state="expanded"] .sp2-expanded {
      display: block;
    }

    #sound-party-widget-refined .sp2-now-playing {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      margin-top: 23px;
      padding-top: 20px;
      border-top: 1px solid var(--sp2-divider);
    }

    #sound-party-widget-refined .sp2-eyebrow {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 6px;
      color: var(--sp2-muted);
    }

    #sound-party-widget-refined .sp2-playing-mark {
      width: 12px;
      height: 2px;
      border-radius: 999px;
      background: var(--sp2-accent);
    }

    #sound-party-widget-refined .sp2-track-name {
      overflow: hidden;
      color: var(--sp2-text);
      font-weight: 500;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #sound-party-widget-refined .sp2-track-artist {
      margin-top: 4px;
      color: var(--sp2-muted);
    }

    #sound-party-widget-refined .sp2-play-button,
    #sound-party-widget-refined .sp2-icon-button,
    #sound-party-widget-refined .sp2-output-button {
      border: 0;
      font: inherit;
      cursor: pointer;
    }

    #sound-party-widget-refined .sp2-play-button {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      padding: 0;
      border-radius: 15px;
      background: var(--sp2-text);
      color: var(--sp2-panel);
    }

    #sound-party-widget-refined .sp2-volume {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 11px;
      margin-top: 22px;
      color: var(--sp2-muted);
    }

    #sound-party-widget-refined .sp2-volume-fill {
      position: relative;
      width: 62%;
      height: 100%;
      border-radius: inherit;
      background: var(--sp2-muted);
    }

    #sound-party-widget-refined .sp2-volume-fill::after {
      content: "";
      position: absolute;
      top: 50%;
      right: -4px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--sp2-text);
      box-shadow: 0 0 0 2px var(--sp2-panel);
      transform: translateY(-50%);
    }

    #sound-party-widget-refined .sp2-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 23px;
      padding-top: 17px;
      border-top: 1px solid var(--sp2-divider);
    }

    #sound-party-widget-refined .sp2-output-button {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 11px;
      border-radius: 10px;
      background: color-mix(in srgb, var(--sp2-accent) 12%, transparent);
      color: var(--sp2-accent);
      font-weight: 500;
    }

    #sound-party-widget-refined .sp2-secondary-actions {
      display: flex;
      gap: 4px;
    }

    #sound-party-widget-refined .sp2-icon-button {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      padding: 0;
      border-radius: 11px;
      background: transparent;
      color: var(--sp2-muted);
    }

    #sound-party-widget-refined .sp2-icon-button:hover {
      background: var(--sp2-panel-raised);
      color: var(--sp2-text);
    }

    #sound-party-widget-refined .sp2-offline {
      display: none;
    }

    #sound-party-widget-refined .sp2-widget[data-state="offline"] {
      width: 66px;
      min-height: 66px;
      border-radius: 20px;
    }

    #sound-party-widget-refined .sp2-widget[data-state="offline"] .sp2-content,
    #sound-party-widget-refined .sp2-widget[data-state="offline"] .sp2-accent-spine {
      display: none;
    }

    #sound-party-widget-refined .sp2-widget[data-state="offline"] .sp2-offline {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--sp2-faint);
    }

    #sound-party-widget-refined .sp2-offline-mark {
      position: absolute;
      right: 0;
      width: 3px;
      height: 22px;
      border-radius: 3px 0 0 3px;
      background: color-mix(in srgb, var(--sp2-accent) 42%, var(--sp2-panel));
    }

    @media (max-width: 680px) {
      #sound-party-widget-refined .sp2-desktop {
        min-height: 545px;
      }

      #sound-party-widget-refined .sp2-context {
        position: static;
        max-width: none;
        padding: 19px 18px 0;
      }

      #sound-party-widget-refined .sp2-widget {
        top: 108px;
        right: 14px;
      }

      #sound-party-widget-refined .sp2-desktop-mark {
        left: 18px;
      }
    }

    @media (max-width: 390px) {
      #sound-party-widget-refined .sp2-content {
        padding-right: 17px;
        padding-left: 17px;
      }

      #sound-party-widget-refined .sp2-connection span:last-child {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #sound-party-widget-refined .sp2-widget,
      #sound-party-widget-refined .sp2-desktop {
        transition: none;
      }
    }
  </style>

      <button class="nav-link" type="button" role="tab" aria-selected="false" data-sp2-state="expanded">展开</button>

    </div>

    <section class="sp2-desktop" aria-label="小米蓝牙音箱 Pro 精致桌面组件效果">

          <div class="sp2-expanded">

  </div>

  <script>
    (() => {
      const root = document.getElementById("sound-party-widget-refined");
      const widget = root.querySelector(".sp2-widget");
      const label = root.querySelector("#sp2-state-label");
      const tabs = [...root.querySelectorAll("[data-sp2-state]")];
      const palettes = {
        warm: {
          panel: "#1b1a18",
          raised: "#25231f",
          soft: "#211f1c",
          text: "#f3eee7",
          muted: "#aaa39a",
          faint: "#77716a",
          divider: "rgba(243, 238, 231, 0.09)",
          track: "rgba(243, 238, 231, 0.12)",
          shadow: "rgba(24, 20, 16, 0.28)",
          desktopA: "#dcd6ce",
          desktopB: "#c8c0b6"
        },
        obsidian: {
          panel: "#111314",
          raised: "#1d2021",
          soft: "#17191a",
          text: "#f2f3f1",
          muted: "#9ba0a0",
          faint: "#666b6c",
          divider: "rgba(242, 243, 241, 0.09)",
          track: "rgba(242, 243, 241, 0.12)",
          shadow: "rgba(7, 9, 10, 0.34)",
          desktopA: "#465052",
          desktopB: "#2d3436"
        },
        ivory: {
          panel: "#eeeae3",
          raised: "#e2ddd5",
          soft: "#e8e3dc",
          text: "#24211d",
          muted: "#716b63",
          faint: "#8c857d",
          divider: "rgba(36, 33, 29, 0.10)",
          track: "rgba(36, 33, 29, 0.13)",
          shadow: "rgba(52, 44, 37, 0.20)",
          desktopA: "#31302e",
          desktopB: "#1f1f1e"
        }
      };
      const state = {
        view: "compact",
        palette: "warm",
        accent: "#c96a36",
        radius: 24,
        texture: true
      };
      const labels = {
        compact: "紧凑状态",
        expanded: "展开状态",
        offline: "离线收起状态"
      };

      function render() {
        const palette = palettes[state.palette];
        root.style.setProperty("--sp2-accent", state.accent);
        root.style.setProperty("--sp2-panel", palette.panel);
        root.style.setProperty("--sp2-panel-raised", palette.raised);
        root.style.setProperty("--sp2-panel-soft", palette.soft);
        root.style.setProperty("--sp2-text", palette.text);
        root.style.setProperty("--sp2-muted", palette.muted);
        root.style.setProperty("--sp2-faint", palette.faint);
        root.style.setProperty("--sp2-divider", palette.divider);
        root.style.setProperty("--sp2-track", palette.track);
        root.style.setProperty("--sp2-shadow", palette.shadow);
        root.style.setProperty("--sp2-desktop-a", palette.desktopA);
        root.style.setProperty("--sp2-desktop-b", palette.desktopB);
        root.style.setProperty("--sp2-radius", `${state.radius}px`);
        widget.dataset.state = state.view;
        widget.classList.toggle("sp2-clean", !state.texture);
        label.textContent = labels[state.view];

        tabs.forEach((tab) => {
          const selected = tab.dataset.sp2State === state.view;
          tab.classList.toggle("active", selected);
          tab.setAttribute("aria-selected", String(selected));
        });
      }

      tabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          state.view = tab.dataset.sp2State;
          render();
        });
      });

      render();

      if (globalThis.Tweak) {
        const tweak = new Tweak({ container: root, onChange: render });
        tweak.addSelect(state, "view", {
          label: "预览状态",
          reference: "widget.view",
          options: [
            { label: "紧凑", value: "compact" },
            { label: "展开", value: "expanded" },
            { label: "离线", value: "offline" }
          ]
        });
        tweak.addSelect(state, "palette", {
          label: "中性色调",
          reference: "widget.palette",
          options: [
            { label: "温润炭黑（推荐）", value: "warm" },
            { label: "纯净曜石", value: "obsidian" },
            { label: "柔和象牙白", value: "ivory" }
          ]
        });
        tweak.addColorPicker(state, "accent", { label: "点缀颜色", reference: "--sp2-accent" });
        tweak.addSlider(state, "radius", { label: "组件圆角", min: 14, max: 30, unit: "px", reference: "--sp2-radius" });
        tweak.addToggle(state, "texture", { label: "细微织物纹理", reference: "widget.texture" });
      }
    })();
  </script>
</div>
