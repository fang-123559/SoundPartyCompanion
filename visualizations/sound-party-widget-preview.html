<div id="sound-party-widget-preview">
  <style>
    #sound-party-widget-preview {
      --sp-orange: #f56600;
      --sp-black: #121212;
      --sp-panel: #1d1d1d;
      --sp-raised: #292929;
      --sp-text: #f4f4f4;
      --sp-muted: #a4a4a4;
      --sp-radius: 22px;
      color: var(--sp-text);
      width: 100%;
      font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif;
    }

    #sound-party-widget-preview .sp-preview-layout {
      display: grid;
      gap: 14px;
      width: 100%;
    }

    #sound-party-widget-preview .sp-state-tabs {
      justify-self: center;
    }

    #sound-party-widget-preview .sp-desktop {
      position: relative;
      min-height: 500px;
      overflow: hidden;
      border-radius: 18px;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.045), transparent 38%),
        linear-gradient(160deg, #363636 0%, #242424 52%, #1b1b1b 100%);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.07);
    }

    #sound-party-widget-preview .sp-desktop-label {
      position: absolute;
      left: 22px;
      bottom: 20px;
      color: rgba(255, 255, 255, 0.55);
      letter-spacing: 0.02em;
    }

    #sound-party-widget-preview .sp-widget {
      position: absolute;
      top: 30px;
      right: 30px;
      width: min(324px, calc(100% - 28px));
      overflow: hidden;
      border-radius: var(--sp-radius);
      background-color: var(--sp-black);
      background-image:
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.018) 0 1px, transparent 1px 3px),
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.012) 0 1px, transparent 1px 3px);
      box-shadow: 0 16px 34px rgba(0, 0, 0, 0.34);
      transition: width 180ms ease, height 180ms ease, border-radius 180ms ease;
    }

    #sound-party-widget-preview .sp-widget.sp-no-texture {
      background-image: none;
    }

    #sound-party-widget-preview .sp-widget[data-state="compact"] {
      min-height: 120px;
    }

    #sound-party-widget-preview .sp-widget[data-state="expanded"] {
      min-height: 350px;
    }

    #sound-party-widget-preview .sp-widget[data-state="offline"] {
      width: 58px;
      min-height: 58px;
      border-radius: min(var(--sp-radius), 18px);
    }

    #sound-party-widget-preview .sp-main {
      position: relative;
      padding: 18px 56px 17px 19px;
    }

    #sound-party-widget-preview .sp-widget.sp-rail-left .sp-main {
      padding-right: 19px;
      padding-left: 56px;
    }

    #sound-party-widget-preview .sp-rail {
      position: absolute;
      z-index: 2;
      top: 0;
      right: 0;
      bottom: 0;
      width: 42px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 11px;
      background: var(--sp-orange);
      color: #161616;
    }

    #sound-party-widget-preview .sp-widget.sp-rail-left .sp-rail {
      right: auto;
      left: 0;
    }

    #sound-party-widget-preview .sp-rail-button,
    #sound-party-widget-preview .sp-media-button,
    #sound-party-widget-preview .sp-output-button {
      border: 0;
      font: inherit;
      cursor: pointer;
    }

    #sound-party-widget-preview .sp-rail-button {
      width: 30px;
      height: 34px;
      display: grid;
      place-items: center;
      padding: 0;
      border-radius: 10px;
      background: transparent;
      color: inherit;
    }

    #sound-party-widget-preview .sp-rail-button:hover {
      background: rgba(0, 0, 0, 0.1);
    }

    #sound-party-widget-preview .sp-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    #sound-party-widget-preview .sp-device-name {
      overflow: hidden;
      color: var(--sp-text);
      font-weight: 500;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #sound-party-widget-preview .sp-online {
      display: inline-flex;
      align-items: center;
      flex: 0 0 auto;
      gap: 6px;
      color: #b9d8c0;
    }

    #sound-party-widget-preview .sp-online-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: #66b978;
    }

    #sound-party-widget-preview .sp-compact-row {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 14px;
      margin-top: 17px;
    }

    #sound-party-widget-preview .sp-battery-value {
      min-width: 50px;
      color: var(--sp-text);
      font-size: 24px;
      font-weight: 500;
      letter-spacing: -0.02em;
    }

    #sound-party-widget-preview .sp-status-copy {
      display: grid;
      gap: 8px;
    }

    #sound-party-widget-preview .sp-status-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--sp-muted);
    }

    #sound-party-widget-preview .sp-volume-track {
      height: 4px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.13);
    }

    #sound-party-widget-preview .sp-volume-fill {
      width: 62%;
      height: 100%;
      background: var(--sp-orange);
    }

    #sound-party-widget-preview .sp-expanded-only {
      display: none;
    }

    #sound-party-widget-preview .sp-widget[data-state="expanded"] .sp-expanded-only {
      display: block;
    }

    #sound-party-widget-preview .sp-widget[data-state="expanded"] .sp-main {
      padding-top: 20px;
      padding-bottom: 20px;
    }

    #sound-party-widget-preview .sp-expanded-overview {
      display: grid;
      grid-template-columns: 76px 1fr;
      align-items: center;
      gap: 15px;
      margin-top: 22px;
    }

    #sound-party-widget-preview .sp-battery-ring {
      width: 68px;
      height: 68px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: conic-gradient(var(--sp-orange) 0 68%, rgba(255, 255, 255, 0.11) 68% 100%);
    }

    #sound-party-widget-preview .sp-battery-ring::before {
      content: "68%";
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: var(--sp-black);
      color: var(--sp-text);
      font-weight: 500;
    }

    #sound-party-widget-preview .sp-output-copy {
      display: grid;
      gap: 5px;
    }

    #sound-party-widget-preview .sp-output-title {
      color: var(--sp-text);
      font-weight: 500;
    }

    #sound-party-widget-preview .sp-output-detail,
    #sound-party-widget-preview .sp-track-artist {
      color: var(--sp-muted);
    }

    #sound-party-widget-preview .sp-now-playing {
      margin-top: 20px;
      padding-top: 17px;
      border-top: 1px solid rgba(255, 255, 255, 0.09);
    }

    #sound-party-widget-preview .sp-track-title {
      overflow: hidden;
      color: var(--sp-text);
      font-weight: 500;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #sound-party-widget-preview .sp-track-artist {
      margin-top: 4px;
    }

    #sound-party-widget-preview .sp-media-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 15px;
    }

    #sound-party-widget-preview .sp-media-button {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      padding: 0;
      border-radius: 14px;
      background: var(--sp-raised);
      color: var(--sp-text);
    }

    #sound-party-widget-preview .sp-media-button.sp-primary {
      width: 48px;
      height: 48px;
      background: var(--sp-orange);
      color: #161616;
    }

    #sound-party-widget-preview .sp-output-button {
      width: 100%;
      margin-top: 16px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(245, 102, 0, 0.14);
      color: #ff9b58;
      font-weight: 500;
    }

    #sound-party-widget-preview .sp-offline-content {
      display: none;
    }

    #sound-party-widget-preview .sp-widget[data-state="offline"] .sp-main,
    #sound-party-widget-preview .sp-widget[data-state="offline"] .sp-rail {
      display: none;
    }

    #sound-party-widget-preview .sp-widget[data-state="offline"] .sp-offline-content {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #8c8c8c;
    }

    #sound-party-widget-preview .sp-offline-content::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 7px;
      background: #6f3517;
    }

    #sound-party-widget-preview .sp-widget.sp-rail-left .sp-offline-content::after {
      right: auto;
      left: 0;
    }

    #sound-party-widget-preview .sp-state-caption {
      position: absolute;
      top: 34px;
      left: 28px;
      max-width: 280px;
      color: rgba(255, 255, 255, 0.78);
    }

    #sound-party-widget-preview .sp-state-caption strong {
      display: block;
      margin-bottom: 6px;
      color: rgba(255, 255, 255, 0.96);
      font-weight: 500;
    }

    @media (max-width: 640px) {
      #sound-party-widget-preview .sp-desktop {
        min-height: 470px;
      }

      #sound-party-widget-preview .sp-state-caption {
        position: static;
        max-width: none;
        padding: 18px 18px 0;
      }

      #sound-party-widget-preview .sp-widget {
        top: 104px;
        right: 14px;
      }

      #sound-party-widget-preview .sp-desktop-label {
        left: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #sound-party-widget-preview .sp-widget {
        transition: none;
      }
    }
  </style>

  <div class="sp-preview-layout">
    <div class="nav nav-pills sp-state-tabs" role="tablist" aria-label="组件状态预览">
      <button class="nav-link active" type="button" role="tab" aria-selected="true" data-state-choice="compact">紧凑</button>
      <button class="nav-link" type="button" role="tab" aria-selected="false" data-state-choice="expanded">展开</button>
      <button class="nav-link" type="button" role="tab" aria-selected="false" data-state-choice="offline">离线</button>
    </div>

    <section class="sp-desktop" aria-label="Sound Party 桌面组件效果预览">
      <div class="sp-state-caption">
        <strong id="sp-preview-state" aria-live="polite">紧凑状态</strong>
        默认放在副屏右上角，黑色织物质感与橙色控制条对应音箱本体。
      </div>

      <div class="sp-widget" data-state="compact" aria-label="小米蓝牙音箱 Pro 桌面组件">
        <div class="sp-rail" aria-label="快捷控制条">
          <button class="sp-rail-button" type="button" aria-label="展开组件" data-tooltip="展开组件">
            <i data-lucide="chevrons-down" aria-hidden="true"></i>
          </button>
          <button class="sp-rail-button" type="button" aria-label="静音" data-tooltip="静音">
            <i data-lucide="volume-2" aria-hidden="true"></i>
          </button>
          <button class="sp-rail-button" type="button" aria-label="设置" data-tooltip="设置">
            <i data-lucide="settings" aria-hidden="true"></i>
          </button>
        </div>

        <div class="sp-main">
          <div class="sp-header">
            <div class="sp-device-name">小米蓝牙音箱 Pro</div>
            <div class="sp-online"><span class="sp-online-dot"></span>已连接</div>
          </div>

          <div class="sp-compact-row">
            <div class="sp-battery-value">68%</div>
            <div class="sp-status-copy">
              <div class="sp-status-line"><span>当前输出 · 立体声</span><span>62</span></div>
              <div class="sp-volume-track" role="progressbar" aria-label="音量" aria-valuenow="62" aria-valuemin="0" aria-valuemax="100">
                <div class="sp-volume-fill"></div>
              </div>
            </div>
          </div>

          <div class="sp-expanded-only">
            <div class="sp-expanded-overview">
              <div class="sp-battery-ring" role="img" aria-label="电量 68%"></div>
              <div class="sp-output-copy">
                <div class="sp-output-title">正在充电</div>
                <div class="sp-output-detail">蓝牙连接稳定 · A2DP</div>
              </div>
            </div>

            <div class="sp-now-playing">
              <div class="sp-track-title">Midnight City</div>
              <div class="sp-track-artist">M83 · 正在播放</div>
              <div class="sp-media-controls" aria-label="媒体控制">
                <button class="sp-media-button" type="button" aria-label="上一首"><i data-lucide="skip-back" aria-hidden="true"></i></button>
                <button class="sp-media-button sp-primary" type="button" aria-label="暂停"><i data-lucide="pause" aria-hidden="true"></i></button>
                <button class="sp-media-button" type="button" aria-label="下一首"><i data-lucide="skip-forward" aria-hidden="true"></i></button>
              </div>
              <button class="sp-output-button" type="button">已设为当前输出</button>
            </div>
          </div>
        </div>

        <div class="sp-offline-content" aria-label="音箱离线">
          <i data-lucide="speaker" aria-hidden="true"></i>
        </div>
      </div>

      <div class="sp-desktop-label">副屏 · 右上角吸附</div>
    </section>
  </div>

  <script>
    (() => {
      const root = document.getElementById("sound-party-widget-preview");
      const widget = root.querySelector(".sp-widget");
      const caption = root.querySelector("#sp-preview-state");
      const tabs = [...root.querySelectorAll("[data-state-choice]")];
      const state = {
        view: "compact",
        accent: "#f56600",
        radius: 22,
        texture: true,
        railSide: "right"
      };

      const labels = {
        compact: "紧凑状态",
        expanded: "展开状态",
        offline: "离线收起状态"
      };

      function render() {
        root.style.setProperty("--sp-orange", state.accent);
        root.style.setProperty("--sp-radius", `${state.radius}px`);
        widget.dataset.state = state.view;
        widget.classList.toggle("sp-no-texture", !state.texture);
        widget.classList.toggle("sp-rail-left", state.railSide === "left");
        caption.textContent = labels[state.view];

        tabs.forEach((tab) => {
          const selected = tab.dataset.stateChoice === state.view;
          tab.classList.toggle("active", selected);
          tab.setAttribute("aria-selected", String(selected));
        });
      }

      tabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          state.view = tab.dataset.stateChoice;
          render();
        });
      });

      render();

      if (globalThis.Tweak) {
        const tweak = new Tweak({ container: root, onChange: render });
        tweak.addSelect(state, "view", {
          label: "预览状态",
          reference: "widget.view",
          options: [
            { label: "紧凑", value: "compact" },
            { label: "展开", value: "expanded" },
            { label: "离线", value: "offline" }
          ]
        });
        tweak.addColorPicker(state, "accent", { label: "控制条颜色", reference: "--sp-orange" });
        tweak.addSlider(state, "radius", { label: "组件圆角", min: 10, max: 32, unit: "px", reference: "--sp-radius" });
        tweak.addToggle(state, "texture", { label: "织物纹理", reference: "widget.texture" });
        tweak.addSelect(state, "railSide", {
          label: "控制条位置",
          reference: "widget.rail-side",
          options: [
            { label: "右侧", value: "right" },
            { label: "左侧", value: "left" }
          ]
        });
      }
    })();
  </script>
</div>
