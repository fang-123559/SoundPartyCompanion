name: Windows build and package

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install verified local SDK
        shell: pwsh
        run: ./scripts/install-dotnet.ps1
      - name: Build, test, publish and compile installer
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Save package and test evidence
        uses: actions/upload-artifact@v4
        with:
          name: SoundPartyCompanion-win-x64
          if-no-files-found: error
          path: |
            artifacts/installer/SoundPartyCompanion-Setup-0.1.1-win-x64.exe
            artifacts/installer/SoundPartyCompanion-Setup-0.1.1-win-x64.exe.sha256
            artifacts/installer/packaging-report-0.1.1.json
            artifacts/test-results/*.trx
